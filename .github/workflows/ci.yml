# CI：离线门禁 + 质量检查（任务书 §14.4 十项）
#
# 设计原则（v3.0.0）：
# - 全部步骤离线可跑：不访问真实微信、不调用任何外部 LLM / 搜索服务、不操作桌面窗口。
#   （唯一的网络访问是 `npm ci` 拉依赖和 `npm audit` 查询公开漏洞库。）
# - 十项门禁映射（都在 verify-windows job 里显式成步）：
#   1. TypeScript 类型检查        → Typecheck
#   2. 单元测试                  → Unit tests（test/core、test/client）
#   3. 集成测试                  → Integration tests（test/engine、test/server、test/channels）
#   4. OCR 离线基准               → OCR bench smoke（只读合成语料；环境不满足时显式 marked skip）
#   5. Windows 兼容性             → Windows compatibility check（OS/Node/PowerShell 5.1 + .ps1 UTF-8 BOM）
#   6. 构建                      → Build (tsc emit)
#   7. API 验证                  → API verification（scripts/verify-api.mjs，离线假宿主）
#   8. 依赖安全检查               → Dependency security audit（npm audit --omit=dev）
#   9. 敏感信息扫描               → Sensitive data scan（scripts/check-sensitive.mjs）
#  10. 发布包内容检查             → Package content check（scripts/check-package.mjs）
# - 不使用「npm ci 失败就 npm install」之类回退：锁文件问题必须直接暴露。
# - linux-guard job 跑与平台无关的子集（类型检查/测试/敏感扫描），OCR bench 在 Linux 上
#   不可能可用，显式 marked skip（见该 job 内 ::notice::）。
# - **不得依赖私人数据**：CI 不读取真实微信、聊天图片、个人截图、OneDrive 路径或任何
#   本机用户目录；OCR 语料全部为 scripts/ocr/gen_corpus.py 生成的合成虚构图像（已入库）。
#   check-sensitive 只扫 git 受跟踪文件；新增加的文件提交后才会被扫描。
# - `private: true` 只表示不发布 npm（GitHub 仓库为 public），CI 不负责发布；
#   发布由维护者手动执行并按 docs/RELEASE-CHECKLIST.md 记录证据。
name: CI

on:
  push:
    branches: [master, main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  # bench 的变体预处理与 RapidOCR 都通过该变量定位 Python（缺失时 bench 冒烟会跳过）
  OCR_BENCH_PYTHON: python

jobs:
  verify-windows:
    name: verify (windows-latest, Node 22)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 锁文件必须可用；安装失败不回退，直接让 CI 红
      - name: Install dependencies (npm ci, no fallback)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 14.4-1 TypeScript 类型检查
      - name: Typecheck
        run: npm run typecheck

      # 14.4-2 单元测试（纯逻辑/核心模块，不依赖平台）
      - name: Unit tests (core + client)
        run: node --import ./test/core/sandbox-preload.mjs ./node_modules/vitest/vitest.mjs run --pool=threads test/core test/client

      # 14.4-3 集成测试（引擎/服务端/通道，使用 fake 通道与假宿主，不碰真实微信）
      - name: Integration tests (engine + server + channels)
        run: node --import ./test/core/sandbox-preload.mjs ./node_modules/vitest/vitest.mjs run --pool=threads test/engine test/server test/channels

      # 14.4-5 Windows 兼容性：打印版本并断言 PowerShell 脚本为 UTF-8 BOM（仓库硬约束）
      - name: Windows compatibility check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Node: $(node --version)"
          Write-Host "PowerShell 7: $($PSVersionTable.PSVersion)"
          $ps51 = & powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 不可用' }
          Write-Host "Windows PowerShell: $ps51"

          $bad = @()
          $scripts = Get-ChildItem -Path 'scripts/pwsh' -Filter '*.ps1' -File
          foreach ($file in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            if (-not $hasBom) { $bad += $file.Name }
          }
          if ($bad.Count -gt 0) { throw "以下 PowerShell 脚本缺少 UTF-8 BOM：$($bad -join '、')" }
          Write-Host "PowerShell UTF-8 BOM 检查通过（$($scripts.Count) 个脚本）"
          $nonAscii = $scripts | Where-Object { $_.Name -match '[^\x00-\x7F]' }
          if ($nonAscii) { throw "PowerShell 脚本文件名含非 ASCII 字符：$($nonAscii.Name -join '、')" }

      # 14.4-6 构建（tsc 输出 dist/；发布包检查与 API 验证都依赖它）
      - name: Build (tsc emit)
        run: npm run build

      # 14.4-7 API 验证（离线假宿主 + 真实 HTTP 端口，不连 DSH、不联网）
      - name: API verification (offline fake host)
        run: node scripts/verify-api.mjs

      # 14.4-8 依赖安全检查（只查生产依赖；发现 high/critical 直接失败）
      - name: Dependency security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      # 14.4-9 敏感信息扫描（受跟踪文件：wxid/手机号/邮箱/本机路径/密钥/疑似姓名）
      - name: Sensitive data scan
        run: node scripts/check-sensitive.mjs

      # 14.4-10 发布包内容检查（private 未改、无运行时数据/备份/截图/敏感串）
      - name: Package content check
        run: node scripts/check-package.mjs

      # 14.4-4 OCR 离线基准冒烟（只读合成语料；WinRT 或 Pillow 不可用时显式 marked skip）
      - name: OCR bench smoke (offline, WinRT; marked skip when unavailable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 前置探测 1：WinRT 中文 OCR（Windows OCR 语言包）
          $probeOk = $false
          $img = Get-ChildItem -Path 'test/fixtures/ocr-corpus/images' -Filter '*.png' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -ne $img -and (Test-Path 'scripts/pwsh/ocr-winrt.ps1')) {
            $probeLines = & powershell -NoProfile -ExecutionPolicy Bypass -File 'scripts/pwsh/ocr-winrt.ps1' -Path $img.FullName 2>$null
            if ($LASTEXITCODE -eq 0 -and $probeLines) {
              try {
                $probe = ($probeLines | Select-Object -Last 1) | ConvertFrom-Json
                $probeOk = ($probe.ok -eq $true)
              } catch {
                $probeOk = $false
              }
            }
          }
          if (-not $probeOk) {
            Write-Host '::notice title=OCR bench smoke skipped::WinRT OCR 不可用（runner 缺中文 OCR 语言包或非 Windows 桌面）→ 显式跳过离线 OCR bench 冒烟（marked skip）'
            exit 0
          }

          # 前置探测 2：bench 生成 upscale2x / gray_contrast 变体需要 Python + Pillow
          $pillowOk = $false
          try {
            & python -c "import PIL; print(PIL.__version__)" *> $null
            $pillowOk = ($LASTEXITCODE -eq 0)
          } catch {
            $pillowOk = $false
          }
          if (-not $pillowOk) {
            Write-Host '::notice title=OCR bench smoke skipped::缺少 Python+Pillow（bench 变体预处理依赖）→ 显式跳过离线 OCR bench 冒烟（marked skip）'
            exit 0
          }

          # 真跑 1 张 clear 场景的 WinRT 原始图（不联网、不截图、不发送）
          node scripts/ocr/bench.mjs --engine=winrt --limit=1 --scenario=clear --pipeline=raw --out-dir=test/fixtures/ocr-corpus/results/ci
          if ($LASTEXITCODE -ne 0) { throw "OCR bench smoke 失败（exit=$LASTEXITCODE）" }
          Write-Host '::notice title=OCR bench smoke passed::离线 OCR bench 冒烟通过（winrt × clear × 1 张，pipeline=raw）'

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "## CI 结果（任务书 §14.4 十项）" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 1 类型检查 / 2 单元测试 / 3 集成测试 / 5 Windows 兼容 / 6 构建 / 7 API 验证 / 8 依赖安全 / 9 敏感扫描 / 10 发布包内容：见上方各步骤" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 4 OCR 离线基准冒烟：只读合成语料；WinRT/Pillow 不可用时以 marked skip 方式跳过" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 私人数据：CI 不读取真实微信/聊天图片/个人截图/OneDrive 路径；所有测试数据为合成虚构内容" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 敏感扫描范围：仅 git 受跟踪文本文件（未跟踪新文件需先提交后才会被扫描）；发布包内容检查只统计受跟踪文件 ∩ package.json files + dist" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 仓库属性：GitHub 仓库 public；private:true 仅表示不发布 npm；CI 不发布、不创建 Release、不打 tag" >> $env:GITHUB_STEP_SUMMARY

  linux-guard:
    name: guard (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (npm ci, no fallback)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Sandbox tests (cross-platform units + fakes)
        run: npm run test:sandbox

      - name: Sensitive data scan
        run: node scripts/check-sensitive.mjs

      - name: OCR bench smoke (Linux 显式跳过)
        run: |
          echo "::notice title=OCR bench smoke skipped::WinRT OCR 仅 Windows 可用；Linux runner 上显式跳过离线 OCR bench 冒烟（marked skip）。"
          echo "这不是失败：桌面通道本身也只在 Windows 上受支持（见 docs/TROUBLESHOOTING.md）。"
          echo "本 job 同样不读取真实微信/聊天图片/个人数据，只跑跨平台单元测试、类型检查与敏感扫描。"
