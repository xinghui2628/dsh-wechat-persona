name: 功能建议（Feature request）
description: 建议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目是个人维护的实验项目（当前 beta），维护精力有限；描述清楚场景、边界与收益会大大提高被采纳概率。
        涉及真实微信自动化的功能，请说明**安全边界**（如何保证不发错人/读错人）以及是否可用 mock 通道验证。
        请勿包含真实联系人信息、聊天截图、wxid、手机号、API Key 或含用户名的路径。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 具体场景、频率、当前影响；若与 beta 已知限制重复，请先看 docs/BETA-LIMITATIONS.md
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做？
      description: 方案或参考实现；说明对默认配置/兼容性/安全默认值的影响
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options: [桌面通道/OCR, 引擎/回复策略, 人格/提示词, 设置界面, 文档, 其他]
  - type: dropdown
    id: safety
    attributes:
      label: 安全影响
      description: 是否需要真实微信发送？是否会读更多隐私数据？
      options: [仅 mock/离线即可验证, 需要只读真实窗口（需授权）, 需要真实发送（默认不采纳）, 不确定]
